[project]
name = "audio-transcriptor"
version = "1.0.1"
description = "Desktop transcription and translation app for Italian audio and video."
requires-python = ">=3.9"
dependencies = [
  "PySide6>=6.7,<7",
  "faster-whisper>=1.0,<2",
  "av>=11,<19",
  "openai>=1.66,<2",
  "python-docx>=1.1,<2",
  "platformdirs>=4.2,<5",
]

[project.scripts]
audio-transcriptor = "audio_transcriptor.app:main"

[tool.ruff]
line-length = 100
